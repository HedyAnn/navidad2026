
<title>Navidad en Familia</title>

<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1d4634; --pine-deep:#12301f; --pine-soft:#e3ebe4;
  --cherry:#b3263a; --cherry-deep:#8e1b2c;
  --cream:#f5eee0; --paper:#fffaf2; --gold:#c39a4e; --gold-soft:#efe1c0;
  --ink:#2a2520; --muted:#6c6357; --line:#e6dccb;
  --ok:#2f6b47;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:"Young Serif", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 17px/1.55 var(--body);min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%, rgba(195,154,78,.10) 0 2px, transparent 3px),
                   radial-gradient(circle at 70% 30%, rgba(29,70,52,.06) 0 2px, transparent 3px);
  background-size:140px 140px, 190px 190px;}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;color:var(--pine-deep)}
h1{font-size:clamp(30px,8vw,40px)} h2{font-size:26px} h3{font-size:20px}
p{margin:0}
a{color:var(--pine)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:15px}

/* ---- estructura ---- */
.shell{max-width:620px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));position:relative;z-index:1}
.band{padding-bottom:96px}
.band-inner{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 16px}
.band .garland{margin:0 -16px;width:calc(100% + 32px)}
.band .brand{color:var(--paper)} .band .brand svg{color:var(--gold)}
.band .btn.quiet{color:rgba(255,250,242,.8)} .band .btn.quiet:hover{color:#fff}
.band .hello h1{color:var(--paper)}
.band .hello p{color:#fffaf2;text-shadow:0 1px 2px rgba(18,48,31,.35)}
.overlap>.card:first-child,.overlap>.stack:first-child{margin-top:-60px!important}
.overlap>:first-child{margin-top:20px}
.garland{display:block;width:100%;height:46px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px}
.brand{font-family:var(--display);font-size:19px;color:var(--pine-deep);display:flex;align-items:center;gap:8px;text-decoration:none}
.brand svg{width:22px;height:22px}
.view{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* navegación inferior en teléfono, arriba en pantallas grandes */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;
  color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 2px;border-radius:12px}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--cherry)}
@media (min-width:760px){
  .tabs{position:sticky;top:0;bottom:auto;border:0;border-bottom:1px solid var(--line);background:rgba(255,250,242,.94);backdrop-filter:blur(6px)}
  .tabs a{flex-direction:row;gap:8px;font-size:15px;max-width:none;flex:0 0 auto;padding:10px 16px}
  .tabs a svg{width:20px;height:20px}
  .shell{padding-bottom:60px}
}

/* ---- tarjetas y piezas ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer;
  background:var(--pine);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn:hover{background:var(--pine-deep)}
.btn.red{background:var(--cherry)} .btn.red:hover{background:var(--cherry-deep)}
.btn.ghost{background:transparent;color:var(--pine);box-shadow:inset 0 0 0 1.5px var(--pine)}
.btn.ghost:hover{background:var(--pine-soft)}
.btn.quiet{background:transparent;color:var(--muted);padding:10px 12px;min-height:40px;font-weight:600}
.btn.quiet:hover{color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;background:var(--pine-soft);color:var(--pine)}
.pill.gold{background:var(--gold-soft);color:#7a5a1c}
.pill.red{background:#f6dfe2;color:var(--cherry-deep)}
label.field{display:grid;gap:6px;font-weight:600;font-size:15px}
.field .hint{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=password],input[type=url],textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-md);
  padding:12px 14px;font-size:17px;min-height:48px}
input:focus,textarea:focus{border-color:var(--pine);outline:none;box-shadow:0 0 0 3px rgba(29,70,52,.15)}
textarea{min-height:84px;resize:vertical}
.error{color:var(--cherry-deep);font-weight:600;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pine-deep);color:#fff;
  padding:12px 20px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(18,48,31,.25);max-width:calc(100% - 32px);text-align:center}

/* ---- noche navideña (ingreso y banda superior) ---- */
.night{position:relative;overflow:hidden;color:var(--paper);
  background:
    radial-gradient(ellipse 70% 70% at 10% 0%, rgba(140,196,150,.45), transparent 70%),
    radial-gradient(ellipse 50% 45% at 95% 15%, rgba(239,225,192,.30), transparent 70%),
    linear-gradient(180deg, #3f8560 0%, #2f7150 60%, #28644a 100%);}
.night>*{position:relative;z-index:1}
.night>.scene,.night>.snow{position:absolute;z-index:0}
.scene{inset:0;pointer-events:none}
.scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(42vh,340px)}
.scene .hang{position:absolute;top:0;transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.band .scene .hills{height:110px}
.night .card{color:var(--ink)}
.snow{inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0)}}

/* ---- ingreso ---- */
.login-page{min-height:100vh;min-height:100dvh;display:grid;align-items:center}
.login{position:relative;z-index:1;width:100%;max-width:1060px;margin:0 auto;display:grid;gap:26px;align-items:center;
  padding:34px max(16px,env(safe-area-inset-right)) 34px max(16px,env(safe-area-inset-left))}
.login-art{display:grid;justify-items:center}
.family{margin:0;width:min(250px,64vw);background:var(--paper);padding:10px 10px 0;border-radius:18px;
  box-shadow:0 24px 50px -18px rgba(0,0,0,.55);transform:rotate(-2deg);position:relative}
.family::after{content:"";display:block;height:16px}
.family img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:11px}
.family::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:24px;transform:translateX(-50%) rotate(3deg);z-index:1;
  background:repeating-linear-gradient(90deg,var(--cherry) 0 10px,#fffaf2 10px 20px);border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.family figcaption{display:none}
.login-panel{display:grid;gap:18px;max-width:500px;width:100%;justify-self:center}
.login-title{text-align:center}
.login-title h1{color:var(--paper);font-size:clamp(32px,7vw,44px);text-wrap:balance}
.login-title h1 .star{display:inline-block;width:.55em;height:.55em;color:var(--gold);vertical-align:.45em;margin-left:.12em}
.login-title p{color:#fffaf2;margin-top:10px;text-shadow:0 1px 2px rgba(18,48,31,.35)}
.login .switch-mode{color:#fffaf2;text-shadow:0 1px 3px rgba(18,48,31,.6)}
.login .switch-mode:hover{color:#fff}
@media (min-width:860px){
  .login{grid-template-columns:1.05fr 1fr;gap:64px}
  .family{width:min(470px,100%);padding:14px 14px 0}
  .family::after{height:46px}
  .family figcaption{display:block;position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--display);color:var(--pine-deep);font-size:19px}
  .login-title{text-align:left}
}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who input{position:absolute;opacity:0;pointer-events:none}
.who label{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;cursor:pointer;font-weight:600;min-height:56px}
.who label:hover{border-color:var(--gold)}
.who input:checked+label{border-color:var(--pine);background:var(--pine-soft)}
.who input:focus-visible+label{outline:3px solid var(--gold);outline-offset:2px}
.initial{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:17px}

/* ---- inicio ---- */
.hello{padding:4px 2px 6px}
.hello p{color:var(--muted);margin-top:8px;max-width:46ch}
.home-card{display:grid;gap:12px;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.home-card:hover{border-color:var(--gold)}
.home-card .head{display:flex;align-items:center;gap:12px}
.home-card .icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.home-card .icon svg{width:26px;height:26px}
.mini-list{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.mini-list li{display:flex;gap:8px;align-items:baseline}
.mini-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;transform:translateY(-2px)}
.meter{display:flex;gap:5px}
.meter span{flex:1;height:7px;border-radius:4px;background:var(--line)}
.meter span.on{background:var(--cherry)}

/* ---- lista de deseos ---- */
.wish{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.wish .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--gold-soft);display:grid;place-items:center;color:#a07c35}
.wish .thumb svg{width:30px;height:30px}
.wish h3{font-size:19px;word-break:break-word}
.wish .desc{color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.wish .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.wish a.ext{display:inline-block;margin-top:6px;font-weight:600;word-break:break-all;font-size:15px}
.empty{text-align:center;padding:30px 20px}
.empty svg{width:70px;height:70px;color:var(--gold)}
.photo-pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo-pick img{width:80px;height:80px;object-fit:cover;border-radius:12px}

/* ---- amigo secreto: el regalo ---- */
.reveal-stage{display:grid;place-items:center;padding:12px 0 4px;text-align:center}
.giftbox{position:relative;width:200px;height:200px;margin:18px auto 8px;cursor:pointer;border:0;background:none;padding:0;display:block}
.giftbox .box{position:absolute;left:18px;right:18px;bottom:0;height:128px;background:var(--cherry);border-radius:8px 8px 12px 12px;
  box-shadow:inset 0 -14px 0 rgba(0,0,0,.10)}
.giftbox .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:var(--gold)}
.giftbox .lid{position:absolute;left:8px;right:8px;top:46px;height:42px;background:var(--cherry-deep);border-radius:8px;
  transition:transform .9s cubic-bezier(.3,1.4,.5,1), opacity .6s .5s;transform-origin:20% 100%;z-index:2}
.giftbox .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:var(--gold)}
.giftbox .bow{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:96px;height:40px}
.giftbox:hover .lid{transform:rotate(-3deg)}
.giftbox.open .lid{transform:translate(-30px,-90px) rotate(-28deg);opacity:0}
.giftbox.shake{animation:shake .6s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.reveal-name{font-family:var(--display);font-size:clamp(40px,12vw,60px);color:var(--cherry);line-height:1.05;margin:6px 0 10px;
  animation:rise .8s .2s both cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.sparkles{position:absolute;inset:0;pointer-events:none}
.sparkles i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:0}
.open .sparkles i{animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}

/* ---- administración ---- */
table.members{width:100%;border-collapse:collapse;font-size:15.5px}
table.members th{text-align:left;font-weight:600;color:var(--muted);font-size:14px;padding:6px 6px;border-bottom:1px solid var(--line)}
table.members td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.switch{position:relative;display:inline-block;vertical-align:middle;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:#cfc6b6;border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--pine)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:disabled+span{opacity:.5}
.switch input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--cream);border-radius:var(--r-md);padding:12px 14px}
.stat b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--pine-deep);display:block;line-height:1.1}
dialog{border:0;border-radius:var(--r-lg);padding:22px;max-width:440px;width:calc(100% - 32px);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(18,48,31,.45)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
<div style="background:#c39a4e;color:#12301f;font:600 14px/1.4 Figtree,system-ui,sans-serif;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))">Vista previa: cualquier contraseña sirve y nada se guarda.</div>

  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

<div id="app"></div>

<template id="garland">
  <svg class="garland" viewBox="0 0 620 46" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6 C 120 40, 200 40, 310 14 S 500 40, 620 6" fill="none" stroke="#3f7d58" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 6 C 120 40, 200 40, 310 14 S 500 40, 620 6" fill="none" stroke="#6fa07f" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
    <g>
      <circle cx="62" cy="21" r="4.5" fill="#b3263a"/><circle cx="135" cy="31" r="4.5" fill="#c39a4e"/>
      <circle cx="210" cy="30" r="4.5" fill="#b3263a"/><circle cx="270" cy="21" r="4.5" fill="#c39a4e"/>
      <circle cx="350" cy="18" r="4.5" fill="#b3263a"/><circle cx="420" cy="30" r="4.5" fill="#c39a4e"/>
      <circle cx="495" cy="31" r="4.5" fill="#b3263a"/><circle cx="565" cy="20" r="4.5" fill="#c39a4e"/>
    </g>
  </svg>
</template>

<script>
// Vista previa: simula el servidor dentro del navegador. Nada se guarda.
(function () {
  const db = {
    members: [
      { id: "mario", name: "Mario", enabled: true }, { id: "maria-angelica", name: "María Angélica", enabled: true },
      { id: "maria-jesus", name: "María Jesús", enabled: true }, { id: "christian", name: "Christian", enabled: true },
      { id: "hedy", name: "Hedy", enabled: true },
    ],
    wishes: {
      mario: [{ id: "a1", title: "Libro de historia", description: "Sobre la Segunda Guerra Mundial, de preferencia de Antony Beevor.", link: "https://www.buscalibre.cl", image: "" },
              { id: "a2", title: "Perfume", description: "Algo fresco, nada muy dulce.", link: "", image: "" },
              { id: "a3", title: "Accesorios tecnológicos", description: "", link: "", image: "" }],
      "maria-angelica": [{ id: "b1", title: "Pantuflas abrigadas", description: "Talla 37", link: "", image: "" }],
      "maria-jesus": [], christian: [],
      hedy: [{ id: "c1", title: "Libro de fantasía", description: "", link: "", image: "" }, { id: "c2", title: "Agenda 2027", description: "", link: "", image: "" }],
    },
    draw: { done: false }, assign: {}, revealed: {}, user: null,
  };
  const res = (data, status = 200) => Promise.resolve(new Response(JSON.stringify(data), { status, headers: { "content-type": "application/json" } }));
  const err = (s, e) => res({ error: e }, s);
  const name = (id) => (db.members.find((m) => m.id === id) || {}).name;
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts = {}) => {
    if (typeof url !== "string" || !url.startsWith("/api")) return realFetch(url, opts);
    const path = url.slice(4), method = opts.method || "GET";
    const body = opts.body ? JSON.parse(opts.body) : {};
    const u = db.user;
    if (path === "/members") return res({ members: db.members.map(({ id, name }) => ({ id, name })) });
    if (path === "/login") {
      if (!body.password) return err(401, "La contraseña no coincide.");
      db.user = body.memberId === "admin" ? { id: "admin", name: "Administración", isAdmin: true } : { id: body.memberId, name: name(body.memberId), isAdmin: false };
      return res({ ok: true });
    }
    if (path === "/logout") { db.user = null; return res({ ok: true }); }
    if (!u) return err(401, "Tu sesión terminó.");
    if (path === "/me") return res({ user: u });
    if (path === "/password") return body.next && body.next.length >= 6 ? res({ ok: true }) : err(400, "La nueva contraseña debe tener al menos 6 caracteres.");
    const mine = db.wishes[u.id] || (db.wishes[u.id] = []);
    if (path === "/dashboard") return res({ name: u.name, wishes: { count: mine.length, max: 6, titles: mine.map((w) => w.title) },
      draw: { done: db.draw.done, participating: !!db.assign[u.id], revealed: !!db.revealed[u.id] } });
    if (path === "/wishes" && method === "GET") return res({ wishes: mine, max: 6 });
    if (path === "/wishes" && method === "POST") {
      if (!body.title?.trim()) return err(400, "Escribe el nombre del regalo.");
      if (mine.length >= 6) return err(400, "Tu lista ya tiene 6 deseos.");
      mine.push({ id: Math.random().toString(36).slice(2), ...body }); return res({ wishes: mine });
    }
    const wm = path.match(/^\/wishes\/(.+)$/);
    if (wm && method === "PUT") { const w = mine.find((x) => x.id === wm[1]); Object.assign(w, body); return res({ wishes: mine }); }
    if (wm && method === "DELETE") { db.wishes[u.id] = mine.filter((x) => x.id !== wm[1]); return res({ wishes: db.wishes[u.id] }); }
    if (path === "/secret") return res({ drawDone: db.draw.done, participating: !!db.assign[u.id], revealed: !!db.revealed[u.id] });
    if (path === "/secret/reveal") {
      if (!db.draw.done) return err(400, "El sorteo todavía no se ha hecho.");
      db.revealed[u.id] = true; const r = db.assign[u.id];
      return res({ receiver: { id: r, name: name(r) }, wishes: db.wishes[r] || [] });
    }
    if (path === "/admin/state") return res({ members: db.members.map((m) => ({ ...m, wishes: (db.wishes[m.id] || []).length, revealed: !!db.revealed[m.id] })),
      draw: { done: db.draw.done, at: db.draw.at, count: Object.keys(db.assign).length } });
    if (path === "/admin/draw") {
      if (db.draw.done) return err(409, "El sorteo ya se realizó.");
      const ids = db.members.filter((m) => m.enabled).map((m) => m.id); let r;
      do { r = [...ids].sort(() => Math.random() - 0.5); } while (r.some((x, i) => x === ids[i]));
      ids.forEach((id, i) => (db.assign[id] = r[i])); db.draw = { done: true, at: Date.now() }; return res({ ok: true });
    }
    if (path === "/admin/draw/reset") { if (String(body.confirm).toUpperCase() !== "REINICIAR") return err(400, "Escribe REINICIAR para confirmar.");
      db.draw = { done: false }; db.assign = {}; db.revealed = {}; return res({ ok: true }); }
    if (path === "/admin/members" && method === "POST") { const id = body.name.toLowerCase().replace(/[^a-z]+/g, "-");
      db.members.push({ id, name: body.name, enabled: true }); return res({ ok: true }); }
    const mm = path.match(/^\/admin\/members\/([^/]+)(\/password)?$/);
    if (mm) { const m = db.members.find((x) => x.id === mm[1]);
      if (!mm[2]) { if (body.name) m.name = body.name; if (typeof body.enabled === "boolean") m.enabled = body.enabled; } return res({ ok: true }); }
    return err(404, "No encontrado.");
  };
})();
</script>
<script>
"use strict";
const $app = document.getElementById("app");
const COLORS = ["#1d4634","#b3263a","#a07c35","#2f6b47","#8e1b2c","#5b6b3a","#7a4a2a"];
const state = { user: null, members: [] };

// ---------- utilidades ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const colorFor = (name) => COLORS[[...name].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const initial = (name) => `<span class="initial" style="background:${colorFor(name)}" aria-hidden="true">${esc(name.trim()[0] || "?")}</span>`;
const garland = () => document.getElementById("garland").innerHTML;
// Paisaje de fondo: colinas con arbolitos nevados y adornos colgando. Siempre igual (semilla fija).
function scene(kind) {
  let seed = kind === "band" ? 7 : 3;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const tree = (x, base, h, fill, snowy) => {
    const w = h * 0.62, t = base - h;
    return `<g><rect x="${x - h*0.05}" y="${base - h*0.12}" width="${h*0.1}" height="${h*0.14}" fill="#5b3a24"/>
      <path d="M${x} ${t} L${x + w*0.32} ${t + h*0.34} H${x + w*0.2} L${x + w*0.42} ${t + h*0.62} H${x + w*0.28} L${x + w*0.5} ${base - h*0.1} H${x - w*0.5} L${x - w*0.28} ${t + h*0.62} H${x - w*0.42} L${x - w*0.2} ${t + h*0.34} H${x - w*0.32} Z" fill="${fill}"/>
      ${snowy ? `<path d="M${x} ${t} L${x + w*0.16} ${t + h*0.17} Q${x} ${t + h*0.22} ${x - w*0.16} ${t + h*0.17} Z" fill="#fffaf2" opacity=".9"/>` : ""}
      ${snowy && rnd() > .5 ? `<circle cx="${x - w*0.12}" cy="${t + h*0.5}" r="${h*0.03}" fill="#d8394f"/><circle cx="${x + w*0.15}" cy="${t + h*0.75}" r="${h*0.03}" fill="#e6c071"/>` : ""}</g>`;
  };
  let back = "", front = "";
  for (let x = -20; x < 1440; x += 46 + rnd() * 40) back += tree(x, 232 - rnd() * 14, 70 + rnd() * 60, "#2a6045", false);
  for (let x = 10; x < 1440; x += 90 + rnd() * 110) front += tree(x, 300, 95 + rnd() * 80, "#1d4f37", true);
  const hills = `<svg class="hills" viewBox="0 0 1400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    ${back}
    <path d="M0 240 Q200 200 420 236 T860 228 T1400 232 V300 H0Z" fill="#f4f7f1" opacity=".55"/>
    ${front}
    <path d="M0 282 Q260 258 560 280 T1100 276 T1400 270 V300 H0Z" fill="#fffaf2"/>
  </svg>`;
  if (kind === "band") return hills;
  const baubles = [[3, 110, "#d8394f"], [10, 60, "#e6c071"], [47, 34, "#fffaf2"], [95, 150, "#d8394f"], [89, 24, "#e6c071"]];
  const hang = baubles.map(([left, len, c], i) => `
    <svg class="hang" style="left:${left}%;animation-delay:-${i * 1.3}s" width="40" height="${len + 40}" viewBox="0 0 40 ${len + 40}" aria-hidden="true">
      <line x1="20" y1="0" x2="20" y2="${len}" stroke="#e6c071" stroke-width="1.5"/>
      <rect x="15" y="${len - 2}" width="10" height="7" rx="1.5" fill="#c39a4e"/>
      <circle cx="20" cy="${len + 19}" r="15" fill="${c}"/>
      <path d="M9 ${len + 16} Q20 ${len + 11} 31 ${len + 16}" stroke="rgba(255,255,255,.45)" stroke-width="2" fill="none"/>
      <circle cx="14" cy="${len + 13}" r="3.5" fill="rgba(255,255,255,.55)"/>
    </svg>`).join("");
  return hills + hang;
}
function snow(n) {
  let out = "";
  for (let i = 0; i < n; i++) {
    const size = (Math.random() * 3 + 1.5).toFixed(1);
    out += `<i style="left:${(Math.random()*100).toFixed(1)}%;width:${size}px;height:${size}px;opacity:${(Math.random()*.5+.25).toFixed(2)};--drift:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${(Math.random()*10+9).toFixed(1)}s;animation-delay:-${(Math.random()*18).toFixed(1)}s"></i>`;
  }
  return out;
}

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: opts.body ? { "content-type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== "/login" && path !== "/password") { state.user = null; renderLogin(); throw new Error("sesión"); }
  if (!res.ok) throw new Error(data.error || "No se pudo completar. Revisa tu conexión e intenta otra vez.");
  return data;
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = label || "Un momento…"; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

    <div class="login-panel">
      <div class="login-title">
        <h1>Navidad en Familia<svg class="star" aria-hidden="true"><use href="#i-star"/></svg></h1>
        <p>${adminMode ? "Entrada para administrar la app: integrantes, contraseñas y sorteo." : "Nuestro rincón para compartir deseos y descubrir, en secreto, a quién le toca tu regalo."}</p>
      </div>
      <form class="card stack" id="loginForm" novalidate>
        ${adminMode ? `<input type="hidden" name="who" value="admin">` : `
        <fieldset style="border:0;padding:0;margin:0" class="stack">
          <legend style="font-weight:600;font-size:15px;margin-bottom:8px">¿Quién eres?</legend>
          <div class="who">
            ${state.members.map((m) => `
              <input type="radio" name="who" id="who-${esc(m.id)}" value="${esc(m.id)}">
              <label for="who-${esc(m.id)}">${initial(m.name)}<span>${esc(m.name)}</span></label>`).join("")}
          </div>
        </fieldset>`}
        <label class="field">Contraseña
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="error hidden" id="loginError" role="alert"></p>
        <button class="btn block red" type="submit">Entrar</button>
      </form>
      <p style="text-align:center">
        <button class="btn quiet switch-mode" type="button" id="switchMode">${adminMode ? "Volver a la entrada de la familia" : "Entrar como administración"}</button>
      </p>
    </div>
  </main>
  </div>`;
  document.getElementById("switchMode").onclick = () => renderLogin(!adminMode);

  };
}

function wishDialog(w) {
  const dlg = document.createElement("dialog");
  let image = w?.image || "";
  dlg.innerHTML = `

    </form>`;

  dlg.showModal();
  const form = dlg.querySelector("form"), err = dlg.querySelector(".error"), prev = dlg.querySelector("#prev"), rm = dlg.querySelector("#rmImg");

    catch { err.textContent = "No pudimos leer esa imagen. Prueba con otra."; err.classList.remove("hidden"); }
  };
  form.onsubmit = async (e) => {

    } catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); busy(btn, false); }
  };
}

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 640, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.8, out = c.toDataURL("image/jpeg", q);
      while (out.length > 260000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = reject; img.src = url;
  });
}

function confirmBox(message, action, opts = {}) {
  return new Promise((resolve) => {
    const dlg = document.createElement("dialog");
    dlg.innerHTML = `<form class="stack" method="dialog">
      <h3>${esc(message)}</h3>
      ${opts.detail ? `<p class="muted">${esc(opts.detail)}</p>` : ""}
      ${opts.typeWord ? `<label class="field">Escribe ${esc(opts.typeWord)} para confirmar<input type="text" name="w" autocomplete="off"></label>` : ""}
      <div class="row" style="justify-content:flex-end">
        <button class="btn quiet" value="no">Cancelar</button>
        <button class="btn red" value="yes">${esc(action)}</button>
      </div></form>`;
    document.body.appendChild(dlg); dlg.showModal();
    dlg.addEventListener("close", () => {
      const v = dlg.returnValue === "yes" && (!opts.typeWord || dlg.querySelector("[name=w]").value.trim());
      dlg.remove(); resolve(v);
    });
  });
}

async function renderSecret() {
  const s = await api("/secret");
  if (!s.drawDone) {
    frame("amigo", `
      <div class="card reveal-stage">
        <div class="giftbox" aria-hidden="true" style="cursor:default">${giftInner()}</div>
        <h1 style="margin-top:8px">Todavía no hay sorteo</h1>
        <p class="muted" style="margin-top:10px;max-width:40ch">¡La magia de la Navidad está por comenzar! Pronto descubrirás a quién tendrás que sorprender este año.</p>
      </div>`);
    return;
  }
  if (!s.participating) {
    frame("amigo", `<div class="card reveal-stage"><h1>No estás en este sorteo</h1>
      <p class="muted" style="margin-top:10px">Si crees que es un error, avísale a quien administra la app.</p></div>`);
    return;
  }
  if (s.revealed) return showReveal(await api("/secret/reveal", { method: "POST", body: {} }), false);
  const view = frame("amigo", `
    <div class="card reveal-stage">
      <h1>¡Llegó el momento!</h1>
      <p class="muted" style="margin-top:10px;max-width:38ch">Descubre a quién tendrás que sorprender. Mejor hazlo a solas, es un secreto.</p>
      <button class="giftbox" id="gift" aria-label="Abrir el regalo">${giftInner()}</button>
      <button class="btn red" id="open">Descubrir mi amigo secreto</button>
    </div>`);
  const go = async () => {
    const gift = view.querySelector("#gift"); const btn = view.querySelector("#open");
    btn.disabled = true; gift.disabled = true;
    let data;
    try { data = await api("/secret/reveal", { method: "POST", body: {} }); }
    catch (e) { toast(e.message); btn.disabled = false; gift.disabled = false; return; }
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    gift.classList.add("shake");
    setTimeout(() => gift.classList.add("open"), reduced ? 0 : 650);
    setTimeout(() => showReveal(data, true), reduced ? 0 : 1700);
  };
  view.querySelector("#open").onclick = go;
  view.querySelector("#gift").onclick = go;
}

function giftInner() {
  const sp = Array.from({length:12},(_,i)=>{const a=i/12*Math.PI*2;return `<i style="left:96px;top:90px;--x:${Math.cos(a)*110}px;--y:${Math.sin(a)*110}px;animation-delay:${(i%3)*.06}s"></i>`}).join("");
  return `<span class="sparkles">${sp}</span>
    <span class="lid"><svg class="bow" viewBox="0 0 96 40"><path d="M48 36C30 10 6 6 10 24c3 12 26 12 38 12zM48 36C66 10 90 6 86 24c-3 12-26 12-38 12z" fill="#c39a4e"/><circle cx="48" cy="34" r="7" fill="#a07c35"/></svg></span>
    <span class="box"></span>`;
}

  frame("amigo", `

    e.preventDefault(); err.classList.add("hidden");
    const name = form.name.value.trim(), pw = form.password.value.trim();
    const btn = form.querySelector("button[type=submit]"); busy(btn, true, "Guardando…");
    try {
      if (m) {
        if (name !== m.name) await api("/admin/members/" + m.id, { method: "PUT", body: { name } });
        if (pw) await api("/admin/members/" + m.id + "/password", { method: "POST", body: { password: pw } });
      } else {
        await api("/admin/members", { method: "POST", body: { name, password: pw } });
      }
      state.members = [];
      dlg.close(); toast(m ? "Cambios guardados" : "Integrante agregado"); renderAdmin();
    } catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); busy(btn, false); }
  };
}

// ---------- rutas ----------
async function route() {
  if (!state.user) return renderLogin();
  const r = (location.hash.replace(/^#\/?/, "") || (state.user.isAdmin ? "admin" : "inicio"));
  try {
    if (state.user.isAdmin) { if (r === "perfil") renderProfile(); else await renderAdmin(); return; }
    if (r === "lista") await renderList();
    else if (r === "amigo") await renderSecret();
    else if (r === "perfil") renderProfile();
    else await renderHome();
  } catch (e) { if (e.message !== "sesión") toast(e.message); }
}

async function boot() {
  try { state.user = (await api("/me")).user; } catch { return; }
  route();
}
window.addEventListener("hashchange", route);
boot();
</script>
